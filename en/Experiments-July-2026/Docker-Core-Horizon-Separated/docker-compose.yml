version: "3.8"

networks:
  stellar-network:
    driver: bridge
    ipam:
      config:
        - subnet: "172.20.0.0/24"

volumes:
  core-data:
  horizon-data:
  pgdata:

services:
  # ─────────────────────────────────────────────
  # Container 1: Stellar Core (Validator)
  # Participates in SCP consensus on the Testnet network
  # Ports: 11625 (P2P), 11626 (HTTP admin)
  # ─────────────────────────────────────────────
  stellar-core:
    build:
      context: ./stellar-core
      dockerfile: Dockerfile
    container_name: stellar-core
    networks:
      stellar-network:
        ipv4_address: 172.20.0.10
    ports:
      - "11625:11625/tcp"
      - "11626:11626/tcp"
    volumes:
      - core-data:/opt/stellar/core
    environment:
      - NETWORK=testnet
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11626/info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ─────────────────────────────────────────────
  # Container 2: Stellar Horizon (API + Ingestion)
  # Provides REST API + manages captive core
  # Ports: 8000 (public HTTP), 5432 (PostgreSQL)
  # ─────────────────────────────────────────────
  stellar-horizon:
    build:
      context: ./stellar-horizon
      dockerfile: Dockerfile
    container_name: stellar-horizon
    networks:
      stellar-network:
        ipv4_address: 172.20.0.11
    ports:
      - "8000:8000/tcp"
    volumes:
      - horizon-data:/opt/stellar/horizon
      - pgdata:/var/lib/postgresql/14/main
    environment:
      - NETWORK=testnet
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
