services:
  stellar:
    image: stellar/quickstart:testing
    container_name: stellar-testnet
    ports:
      - "8000:8000"       # Horizon
      - "11625:11625"     # Stellar Core P2P
      - "11626:11626"     # Stellar Core HTTP
    environment:
      NETWORK: testnet
      ENABLE: core,horizon
      LOG_LEVEL: info
    volumes:
      - stellar-data:/opt/stellar
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  stellar-data:
